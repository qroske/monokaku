name: update-flake-lock
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.MONOKAKU_WORKFLOW_BOT_ID }}
          private-key: ${{ secrets.MONOKAKU_WORKFLOW_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ steps.app-token.outputs.token }}
          pr-title: "chore(flake): update flake.lock"
          commit-msg: "chore(flake): update flake.lock"
          pr-body: "flake.lock の自動更新（nixpkgs / rust-overlay 等の pin 更新）。"
          git-author-name: "${{ steps.app-token.outputs.app-slug }}[bot]"
          git-author-email: "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          base: main
