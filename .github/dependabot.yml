version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-major:
        update-types:
          - "major"
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-nix"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
